name: News and column fact check

# Runs on every pull request that touches news stories: opens each source page and
# confirms every quoted fact is really there. A failing check means don't merge.
on:
  pull_request:
    paths: ['src/pages/news/**', 'src/pages/blog/**', 'src/pages/reviews/**', 'src/data/rules/**', 'sources/**', 'scripts/check-news.mjs', 'scripts/check-style.mjs', 'scripts/news-sources.json']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get install -y poppler-utils   # pdftotext, for GOV.UK PDFs
      - run: npm ci
      - run: npm run check-news:live
      - run: npm run build
